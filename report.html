<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Report Generation</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #7697d0, #5a82c7);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 15px;
    }

    .container {
        width: 100%;
        max-width: 550px;
        background: #ffffff;
        padding: 35px 30px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }

    h2 {
        color: #1c1c1e;
        margin-bottom: 25px;
        font-size: 22px;
        text-align: center;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 6px;
        color: #444;
    }

    #select-design, input[type="date"], input[type="time"] {
        width: 100%;
        padding: 12px;
        border: 1.5px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s ease;
        background-color: #f9f9f9;
    }

    #select-design:focus, input[type="date"]:focus, input[type="time"]:focus {
        border-color: #5a82c7;
        background-color: #fff;
    }

    .button-group {
        display: flex;
        gap: 12px;
        margin-top: 25px;
    }

    button {
        flex: 1;
        padding: 12px 20px;
        background-color: #5a82c7;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease;
    }

    button:hover {
        background-color: #4369ad;
    }

    #logoutButton {
        background-color: #c75a5a;
    }

    #logoutButton:hover {
        background-color: #b04343;
    }

    @media (max-width: 480px) {
        .container {
            padding: 25px 20px;
        }

        .button-group {
            flex-direction: column;
        }
    }
</style>
</head>
<body>

<div class="container">
    <h2>Admin Report Generation</h2>
    <div class="form-group">
        <label for="select-design">Select Lab</label>
        <select id="select-design" name="Lab">
            <option>Choose Lab</option>
            <option value="Research Lab">Research Lab</option>
            <option value="OS Lab">OS Lab</option>
            <option value="Network Lab">Network Lab</option>
        </select>
    </div>
    <div class="form-group">
        <label for="fromDate">From Date:</label>
        <input type="date" id="fromDate" name="fromDate">
    </div>
    <div class="form-group">
        <label for="toDate">To Date:</label>
        <input type="date" id="toDate" name="toDate">
    </div>
    <div class="form-group">
        <label for="fromTime">From Time:</label>
        <input type="time" id="fromTime" name="fromTime">
    </div>
    <div class="form-group">
        <label for="toTime">To Time:</label>
        <input type="time" id="toTime" name="toTime">
    </div>
    
    <div class="button-group">
        <button type="submit">Search</button>
        <button type="button" id="logoutButton">Logout</button>
    </div>
</div>
<script>
    // JavaScript code for handling the logout button click event
    document.getElementById('logoutButton').addEventListener('click', function() {
      // Redirect to the admin.html page
      window.location.href = "admin.html";
    });
  </script>
</body>
</html>
