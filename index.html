<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Laboratory Foyer</title>
    <link rel="icon" href="fxec logo.png" type="images/x-icon">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        *, html, body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url(bg.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            padding: 20px 15px;
        }

        .container {
            width: 95%;
            max-width: 380px;
            padding: 40px 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .logo {
            width: 100%;
            max-width: 300px;
            height: auto;
            margin-bottom: 35px;
            display: block;
            object-fit: contain;
        }

        #st, .ad {
            height: 46px;
            width: 100%;
            max-width: 240px;
            border: none;
            background-color: #5a82c7;
            color: white;
            border-radius: 8px;
            transition: all 0.2s ease;
            letter-spacing: 2px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin: 10px 0;
            display: block;
        }

        #st:hover, .ad:hover {
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px #5a82c7;
            background-color: #4a72b7;
        }

        a {
            text-decoration: none;
            width: 100%;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="fx.png" alt="logo">
        <a href="Student.html"><button id="st">STUDENT LOGIN</button></a>
        <a href="admin.html"><button class="ad">ADMIN LOGIN</button></a>
    </div>
</body>
</html>
